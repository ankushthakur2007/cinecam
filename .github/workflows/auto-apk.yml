name: Auto APK

# Every push to main builds a debuggable APK and publishes it as a
# prerelease. Prereleases never trigger the in-app updater (it reads
# releases/latest, i.e. stable releases only). Stable releases like v0.1.0
# stay manual via `gh release create`.
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug --console=plain

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="$(git rev-parse --short HEAD)"
          VER="$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)"
          TAG="auto-${SHA}"
          cp app/build/outputs/apk/debug/app-debug.apk "cinecam-${TAG}.apk"
          gh release create "$TAG" "cinecam-${TAG}.apk" \
            --prerelease \
            --title "Auto build ${VER} (${SHA})" \
            --notes "Automatic CI build from commit ${SHA}. Debug-signed sideload APK (Android 10+); allow unknown sources to install."
